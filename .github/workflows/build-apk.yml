
name: Crear APK SECURCONTROL

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Instalar extractor
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full

      - name: Extraer proyecto RAR o ZIP
        run: |
          ARCHIVE=$(find . -maxdepth 1 -type f \( -iname '*.rar' -o -iname '*.zip' \) -print -quit)
          if [ -z "$ARCHIVE" ]; then
            echo "No se encuentra el archivo RAR o ZIP"
            exit 1
          fi
          mkdir -p extracted
          7z x "$ARCHIVE" -oextracted -y
          SETTINGS=$(find extracted -type f -name settings.gradle -print -quit)
          if [ -z "$SETTINGS" ]; then
            echo "No se encuentra settings.gradle"
            exit 1
          fi
          PROJECT_DIR="${SETTINGS%/settings.gradle}"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Compilar APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Preparar APK
        run: |
          mkdir -p output
          cp "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" output/SECURCONTROL.apk

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: SECURCONTROL-APK
          path: output/SECURCONTROL.apk
