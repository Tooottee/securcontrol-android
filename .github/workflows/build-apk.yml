
name: Crear APK SECURCONTROL

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Instalar extractor
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full

      - name: Extraer proyecto
        run: |
          ARCHIVE=$(find . -maxdepth 1 -type f \( -iname '*.rar' -o -iname '*.zip' \) -print -quit)
          if [ -z "$ARCHIVE" ]; then
            echo "No se encuentra el archivo del proyecto"
            exit 1
          fi
          mkdir extracted
          7z x "$ARCHIVE" -oextracted -y
          SETTINGS=$(find extracted -name settings.gradle -print -quit)
          if [ -z "$SETTINGS" ]; then
            echo "No se encuentra settings.gradle"
            exit 1
          fi
          PROJECT_DIR="${SETTINGS%/settings.gradle}"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Reparar configuración Gradle
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          root = Path(os.environ["PROJECT_DIR"])
          for name in ["build.gradle", "app/build.gradle"]:
              p = root / name
              if p.exists():
                  s = p.read_text()
                  p.write_text(s.replace("\\n", "\n"))
          PY

      - name: Compilar aplicación
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Preparar APK
        run: |
          mkdir -p output
          cp "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" output/SECURCONTROL.apk

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: SECURCONTROL-APK
          path: output/SECURCONTROL.apk
